[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "po-assistant"
version = "0.1.0"
description = "Asistente IA para Product Owners — Flexicar"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "anthropic>=0.30",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.scripts]
po = "po_assistant.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/po_assistant"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]
